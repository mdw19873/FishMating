# FishMating Plugin Configuration
# Author: mrsuffix
# Version: ${project.version}

# General Settings
settings:
  # Radius in blocks for fish to detect seeds and other fish
  detection-radius: 5.0

  # Time in seconds before breeding readiness expires
  breeding-timeout-seconds: 30

  # Time in minutes fish must wait between breeding attempts
  breeding-cooldown-minutes: 5

  # XP dropped at the baby when a pair breeds (random 1 to this value; vanilla is 1-7).
  # Capped at 7; set to 0 to disable.
  breeding-experience: 7

  # Whether to show particle effects
  enable-particles: true

  # Number of particles to show for effects
  particle-count: 5

# Fish to Seed Mappings
# Format: fish_type: seed_material
fish-mappings:
  salmon: wheat_seeds
  cod: pumpkin_seeds
  pufferfish: melon_seeds
  tropical_fish: beetroot_seeds

# Advanced Settings
advanced:
  # Whether to log debug information (raises the plugin log level to FINE)
  debug-logging: false

  # Maximum number of fish that can be tracked simultaneously
  max-tracked-fish: 1000

  # Bred fish spawn small and grow to full size over time. Set false for full-size babies.
  natural-growth: true
  # Starting size of a bred fish, 0.1-1.0 (1.0 = full adult); used when natural-growth is on.
  baby-scale: 0.5
  # Minutes for a baby to grow to full size.
  growth-duration-minutes: 10

  # Chance a ready pair actually produces a baby, 0.0-1.0.
  breeding-success-rate: 1.0

  # Only seeds thrown by a player attract fish. Blocks automated (dispenser/dropper)
  # breeding farms. Set false to let any dropped seed work.
  require-player-thrown-seeds: true

  # Require a player within this many blocks for fish to seek seeds or breed. Blocks
  # unattended/chunk-loader farms. 0 disables the check (no presence required).
  require-player-within: 0

  # Respect the WorldGuard region flag "allow-fish-breeding". Breeding is allowed
  # everywhere unless a region sets the flag to DENY. Requires WorldGuard installed;
  # ignored otherwise.
  worldguard-integration: false

  # Let a bred baby inherit "won't despawn" persistence when at least one parent already
  # persists (e.g. a fish placed from a bucket). Wild-fish offspring still despawn, so this
  # only carries the trait forward through player-invested lineages.
  inherit-persistence: false
