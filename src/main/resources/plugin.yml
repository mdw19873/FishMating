name: FishMating
version: 1.0.0
main: com.mrsuffix.fishmating.FishMatingPlugin
author: mrsuffix
description: A plugin that simulates fish breeding triggered by throwing seeds into water
api-version: 1.21.11
website: https://github.com/mrsuffix/fishmating

softdepend: []

commands:
  fishmating:
    description: FishMating administrative commands
    usage: /fishmating reload
    aliases: [fm]

permissions:
  fishmating.admin:
    description: Allows reloading the FishMating configuration
    default: op
