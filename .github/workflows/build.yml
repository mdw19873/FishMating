name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: the build only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload plugin jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: fishmating-jar
          path: target/fishmating-*.jar
          if-no-files-found: error

      - name: Upload JaCoCo coverage report
        if: ${{ matrix.java == '21' && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

  # Compile the main sources against the floor (1.21.0) and ceiling (26.1) APIs to
  # guarantee a single jar stays valid across the whole supported range.
  api-compat:
    name: API compat (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'floor 1.21'
            profile: paper-floor
            java: '21'
          - label: 'ceiling 26.1'
            profile: paper-26
            java: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile against ${{ matrix.label }} API
        run: mvn -B --no-transfer-progress -P${{ matrix.profile }} clean compile
